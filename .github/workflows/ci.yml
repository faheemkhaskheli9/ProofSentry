name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q services packages tests && python -m unittest discover -v
      - run: docker compose config --quiet && docker compose up --build --wait
      - run: curl --fail --silent http://127.0.0.1:8000/healthz | python -c 'import json,sys; assert json.load(sys.stdin) == {"status":"ok"}'
      - if: always()
        run: docker compose down
